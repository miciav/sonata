# Pre-commit hooks for sonata.
#
#   uv run pre-commit install          # enable on commit
#   uv run pre-commit run --all-files  # run everything once
#
# Version policy: the ruff revision below MUST stay in sync with the `ruff`
# pin in pyproject.toml. A newer ruff in pre-commit than in the dev environment
# makes the hook report violations that `uv run ruff check` does not.
#
# No default_language_version is set on purpose: pinning it to a specific
# python3.x makes pre-commit fail outright on a machine that does not have that
# interpreter on PATH. The hooks that need the project's interpreter run through
# `uv run --frozen` against the workspace venv, which pins Python itself in
# .python-version.
#
# sonata is a uv workspace of two packages, each with its own ruff, basedpyright
# and bandit configuration and its own source tree. Each local hook below is
# scoped to one of them rather than sharing a single invocation, because the
# engine and the catalogue are deliberately independent: the CI job that checks
# the catalogue installs every optional integration, and the engine job must not
# be able to see the catalogue at all.

fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # Ruff - lint + format
  #
  # The root configuration covers both trees; extend-exclude keeps the build
  # directories out of it.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  # ---------------------------------------------------------------------------
  # Type checking, per package
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: basedpyright-engine
        name: basedpyright (engine)
        entry: uv run --frozen basedpyright --project .
        language: system
        pass_filenames: false
        files: ^src/

      - id: basedpyright-catalogue
        name: basedpyright (catalogue)
        entry: uv run --frozen basedpyright --project packages/sonata-tasks
        language: system
        pass_filenames: false
        files: ^packages/sonata-tasks/(src|tests)/

      # The engine must not import the catalogue, and the catalogue must not
      # import the downstream products. CI runs exactly this.
      - id: import-linter-catalogue
        name: import-linter (catalogue)
        entry: >-
          uv run --frozen lint-imports
          --config packages/sonata-tasks/.importlinter --no-cache
        language: system
        pass_filenames: false
        files: ^(src|packages/sonata-tasks/src)/

  # ---------------------------------------------------------------------------
  # Security, per package
  #
  # This package drives VMs and containers through external CLIs, so subprocess
  # is its subject matter rather than a smell. B602 (shell=True) is deliberately
  # not skipped anywhere: no call here uses it, and that must stay true.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      # `id` must be the upstream hook id; `alias` is what lets the same hook
      # run twice with different settings.
      - id: bandit
        alias: bandit-engine
        name: bandit (engine)
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/
        exclude: ^tests/

      - id: bandit
        alias: bandit-catalogue
        name: bandit (catalogue)
        args: ["-c", "packages/sonata-tasks/pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^packages/sonata-tasks/src/

  # ---------------------------------------------------------------------------
  # Generic file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: mixed-line-ending
        args: [--fix=lf]
