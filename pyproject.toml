[project]
name = "sonata-engine"
version = "0.5.0"
description = "A small, product-independent workflow engine for Python"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonata_engine = ["py.typed"]

[tool.uv.workspace]
members = ["packages/sonata-tasks"]

[tool.uv.sources]
sonata-engine = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sonata_engine --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.basedpyright]
include = ["src/sonata_engine"]
typeCheckingMode = "standard"
reportImplicitOverride = true
