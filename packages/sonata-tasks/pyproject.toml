[project]
name = "sonata-tasks"
license = "MIT"
license-files = ["LICENSE"]
version = "0.2.0"
description = "Reusable task catalogue for the Sonata workflow engine"
requires-python = ">=3.12"
dependencies = [
    "sonata-engine @ git+https://github.com/miciav/sonata.git@e81d559952d4a168edffbe3c7108bd9a017046e9",
]

[project.optional-dependencies]
shell = [
    "shellcraft @ git+https://github.com/miciav/shellcraft.git@9f2726ac31ab5bdcbf9a378f1cc4d99bdb5090c0",
]
prometheus = ["httpx>=0.27"]
multipass = [
    "multipass-sdk @ git+https://github.com/miciav/multipass-sdk.git@402c4061e6b32cc6dda5e7a9876fa7cefd6f9ae1",
    "pydantic>=2.9.2",
    "shellcraft @ git+https://github.com/miciav/shellcraft.git@9f2726ac31ab5bdcbf9a378f1cc4d99bdb5090c0",
]
azure = [
    "azure-vm-sdk @ git+https://github.com/miciav/azure-vm-sdk.git@eb8a54203e36ea48cb37ba26044353ba4afc8259",
    "pydantic>=2.9.2",
    "shellcraft @ git+https://github.com/miciav/shellcraft.git@9f2726ac31ab5bdcbf9a378f1cc4d99bdb5090c0",
]
proxmox = [
    "proxmox-sdk @ git+https://github.com/miciav/proxmox-sdk.git@b82c68c3ed5ecfdb9b90c047bb43df4749dd9817",
    "pydantic>=2.9.2",
    "shellcraft @ git+https://github.com/miciav/shellcraft.git@9f2726ac31ab5bdcbf9a378f1cc4d99bdb5090c0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonata_tasks = ["py.typed"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "httpx>=0.27",
    "grimp>=3.14",
    "import-linter>=2.11",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sonata_tasks --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"**/tests/**/*.py" = ["ANN"]

[tool.basedpyright]
include = ["src/sonata_tasks", "tests"]
typeCheckingMode = "standard"
reportImplicitOverride = true
reportMissingTypeStubs = false
venvPath = "../.."
venv = ".venv"
